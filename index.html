<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  :root {
    --space: 24px;               /* one spacing value used for every padding and gap */
    --radius: 22px;
    --bw: 2px;                   /* border thickness used by every outlined element */
    --bg: #fafafa;
    --fg: #111;
    --muted: #6b6b6b;
    --surface: #fff;
    --border: #1a1a1a;
    --soft: rgba(0,0,0,.06);
    --shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  :root[data-theme="dark"] {
    --bw: 1.7px;                 /* light-on-dark lines look heavier, so trim slightly to match */
    --bg: #121212;
    --fg: #f1f1f1;
    --muted: #a0a0a0;
    --surface: #1d1d1d;
    --border: #e8e8e8;
    --soft: rgba(255,255,255,.08);
    --shadow: 0 2px 10px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .4s ease, color .4s ease;
  }

  .page {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: var(--space);
    display: flex;
    flex-direction: column;
    gap: var(--space);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space);
  }
  h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -.02em; }
  .actions { display: flex; align-items: center; gap: 8px; position: relative; }

  .icon-btn {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: transparent; color: var(--fg);
    border: none; border-radius: 50%;
    cursor: pointer;
    transition: background .2s;
  }
  .icon-btn:hover { background: var(--soft); }
  .icon-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Moon <-> Sun toggle */
  #menu-btn { width: 48px; height: 48px; }
  #menu-btn svg { width: 28px; height: 28px; }
  #theme-toggle .icon { position: relative; width: 24px; height: 24px; }
  #theme-toggle svg {
    position: absolute; inset: 0;
    transition: transform .5s cubic-bezier(.4,0,.2,1), opacity .35s ease;
  }
  #theme-toggle .sun  { opacity: 0; transform: rotate(-90deg) scale(.4); }
  #theme-toggle .moon { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="dark"] #theme-toggle .sun  { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="dark"] #theme-toggle .moon { opacity: 0; transform: rotate(90deg) scale(.4); }

  /* Menu dropdown */
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 210px;
    background: var(--surface);
    border: var(--bw) solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 6px;
    display: none;
    z-index: 20;
  }
  .menu.open { display: block; animation: pop .15s ease; }
  .menu button {
    width: 100%; text-align: left;
    display: flex; align-items: center; gap: 12px;
    white-space: nowrap;
    background: none; border: none; color: var(--fg);
    font: inherit; font-size: .95rem;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
  }
  .menu button svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .menu button:hover { background: var(--soft); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* Search */
  .search-row { display: flex; gap: var(--space); }
  .search {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 var(--space);
    background: var(--surface);
    border: var(--bw) solid var(--border);
    border-radius: 999px;
    transition: box-shadow .2s;
  }
  .search:focus-within { box-shadow: var(--shadow); }
  .search svg.g { width: 22px; height: 22px; flex: none; }
  .search input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: var(--fg); font: inherit; font-size: 1.05rem;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  .clear {
    display: none; flex: none;
    width: 32px; height: 32px; margin-right: -6px;
    place-items: center;
    background: none; border: none; border-radius: 50%;
    color: var(--fg); cursor: pointer;
  }
  .clear:hover { background: var(--soft); }
  .clear svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .search.has-text .clear { display: grid; }

  .ai-btn {
    width: 56px; height: 56px; flex: none;
    display: grid; place-items: center;
    background: var(--surface); color: var(--fg);
    border: var(--bw) solid var(--border);
    border-radius: 18px;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
  }
  .ai-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .ai-btn svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Shortcuts card */
  .card {
    background: var(--surface);
    border: var(--bw) solid var(--border);
    border-radius: 32px;
    padding: var(--space);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space);
    justify-items: center;
    align-items: start;
  }
  .item {
    position: relative;
    width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-decoration: none; color: var(--fg);
  }
  .circle {
    width: 100%; max-width: 72px; aspect-ratio: 1;
    border: var(--bw) solid var(--border);
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    overflow: hidden;
    transition: transform .15s, box-shadow .2s;
  }
  a.item:hover .circle { transform: translateY(-3px); box-shadow: var(--shadow); }
  .circle img { width: 55%; height: 55%; object-fit: contain; }
  .circle .letter { font-weight: 600; font-size: 1.4rem; text-transform: uppercase; }
  .label {
    font-size: .8rem; color: var(--muted);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wrap { position: relative; width: 100%; max-width: 72px; }
  .wrap .circle { max-width: none; }
  .remove {
    position: absolute; top: -6px; right: -6px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--fg); color: var(--bg);
    border: none; cursor: pointer;
    font-size: 16px; line-height: 1;
    display: none; place-items: center;
  }
  .editing .remove { display: grid; }
  .editing a.item .circle { animation: wiggle .35s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  .card-bar { display: none; justify-content: flex-end; margin-bottom: var(--space); }
  .editing .card-bar { display: flex; }

  button.add .circle { cursor: pointer; }
  button.add { background: none; border: none; font: inherit; color: inherit; cursor: pointer; padding: 0; }
  button.add .circle svg { width: 45%; height: 45%; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; fill: none; }
  button.add:hover .circle { transform: rotate(90deg); }

  /* Popup */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    padding: var(--space); z-index: 50;
  }
  .overlay.open { display: flex; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .dialog {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: var(--bw) solid var(--border);
    border-radius: 28px;
    padding: var(--space);
    display: flex; flex-direction: column; gap: var(--space);
  }
  .dialog h2 { font-size: 1.15rem; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: .85rem; color: var(--muted); }
  .field input {
    height: 44px; padding: 0 14px;
    background: var(--bg); color: var(--fg);
    border: var(--bw) solid var(--border); border-radius: 14px;
    font: inherit; outline: none;
  }
  .field input:focus { box-shadow: 0 0 0 3px var(--soft); }
  .buttons { display: flex; justify-content: flex-end; gap: 12px; }
  .btn {
    height: 40px; padding: 0 20px;
    border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer;
    border: var(--bw) solid var(--border);
    background: transparent; color: var(--fg);
  }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn:hover { opacity: .85; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: var(--space);
    transform: translate(-50%, 20px);
    background: var(--fg); color: var(--bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: .9rem; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 420px) {
    :root { --space: 16px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1 id="greeting">Hello</h1>
    <div class="actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="icon">
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
      <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="export-btn">
          <svg viewBox="0 0 24 24"><path d="M12 4v10M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          Export shortcuts
        </button>
        <button role="menuitem" id="import-btn">
          <svg viewBox="0 0 24 24"><path d="M12 15V5M7.5 9L12 4.5 16.5 9"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          Import shortcuts
        </button>
        <button role="menuitem" id="edit-btn">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
          Edit shortcuts
        </button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="search-row">
    <form class="search" action="https://www.google.com/search" method="get" role="search">
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      <input type="search" name="q" id="q" placeholder="Search Google" autocomplete="off" aria-label="Search Google">
      <button type="button" class="clear" id="clear" aria-label="Clear search">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <button class="ai-btn" id="ai-btn" aria-label="Google AI Mode" title="AI Mode">
      <svg viewBox="0 0 24 24"><g transform="translate(-.25 -2.15)"><path d="M9.5 7.6A6 6 0 1 0 16.5 13"/><path d="M15.2 18L20 22.5"/><path d="M14.5 5.8C14.8 8 15.5 8.7 17.7 9c-2.2.3-2.9 1-3.2 3.2-.3-2.2-1-2.9-3.2-3.2 2.2-.3 2.9-1 3.2-3.2z" fill="currentColor" stroke-width="1"/></g></svg>
    </button>
  </div>

  <section class="card" id="card" aria-label="Shortcuts">
    <div class="card-bar"><button type="button" class="btn primary" id="done">Done</button></div>
    <div class="grid" id="grid"></div>
  </section>

</div>

<div class="overlay" id="overlay">
  <form class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title">Add shortcut</h2>
    <div class="field">
      <label for="s-title">Title</label>
      <input id="s-title" type="text" placeholder="e.g. YouTube" required>
    </div>
    <div class="field">
      <label for="s-url">URL</label>
      <input id="s-url" type="text" placeholder="e.g. youtube.com" required>
    </div>
    <div class="buttons">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Add</button>
    </div>
  </form>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const KEY_SHORTCUTS = 'startpage.shortcuts';
  const KEY_THEME = 'startpage.theme';

  /* ---------- Greeting ---------- */
  function updateGreeting() {
    const h = new Date().getHours();
    let text;
    if (h >= 5 && h < 12) text = 'Good morning';
    else if (h >= 12 && h < 17) text = 'Good afternoon';
    else if (h >= 17 && h < 21) text = 'Good evening';
    else text = 'Good night';
    $('greeting').textContent = text;
  }
  updateGreeting();
  setInterval(updateGreeting, 60 * 1000);

  /* ---------- Theme ---------- */
  function getSavedTheme() {
    try { return localStorage.getItem(KEY_THEME); } catch { return null; }
  }
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem(KEY_THEME, t); } catch {}
  }
  const initial = getSavedTheme() ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.setAttribute('data-theme', initial);
  $('theme-toggle').addEventListener('click', () => {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Search / AI mode ---------- */
  $('ai-btn').addEventListener('click', () => {
    const q = $('q').value.trim();
    const url = 'https://www.google.com/search?udm=50' + (q ? '&q=' + encodeURIComponent(q) : '');
    window.location.href = url;
  });

  /* ---------- Menu ---------- */
  const menu = $('menu'), menuBtn = $('menu-btn');
  function closeMenu() { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target)) closeMenu(); });

  /* ---------- Search clear button ---------- */
  const q = $('q'), searchForm = q.closest('.search');
  function syncClear() { searchForm.classList.toggle('has-text', q.value.length > 0); }
  q.addEventListener('input', syncClear);
  $('clear').addEventListener('click', () => { q.value = ''; syncClear(); q.focus(); });
  syncClear();

  /* ---------- Edit mode ---------- */
  let editing = false;
  function setEditing(on) {
    editing = on;
    $('card').classList.toggle('editing', on);
  }
  $('edit-btn').addEventListener('click', () => { closeMenu(); setEditing(true); });
  $('done').addEventListener('click', () => setEditing(false));

  /* ---------- Shortcuts storage ---------- */
  let shortcuts = [];
  try { shortcuts = JSON.parse(localStorage.getItem(KEY_SHORTCUTS)) || []; } catch { shortcuts = []; }
  function save() { try { localStorage.setItem(KEY_SHORTCUTS, JSON.stringify(shortcuts)); } catch {} }

  function normalizeUrl(raw) {
    let u = raw.trim();
    if (!u) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
    try {
      const parsed = new URL(u);
      if (!/^https?:$/.test(parsed.protocol)) return null;
      return parsed.href;
    } catch { return null; }
  }
  function hostOf(url) { try { return new URL(url).hostname; } catch { return ''; } }
  function faviconUrl(url) {
    return 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(hostOf(url));
  }

  /* ---------- Render ---------- */
  const grid = $('grid');
  function render() {
    grid.textContent = '';

    shortcuts.forEach((s, i) => {
      const a = document.createElement('a');
      a.className = 'item';
      a.href = s.url;
      a.title = s.title;

      const wrap = document.createElement('div');
      wrap.className = 'wrap';
      const circle = document.createElement('div');
      circle.className = 'circle';
      const img = document.createElement('img');
      img.alt = '';
      img.src = faviconUrl(s.url);
      img.addEventListener('error', () => {
        circle.textContent = '';
        const l = document.createElement('span');
        l.className = 'letter';
        l.textContent = (s.title || '?').trim().charAt(0);
        circle.appendChild(l);
      });
      circle.appendChild(img);

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = s.title;

      const rm = document.createElement('button');
      rm.className = 'remove';
      rm.type = 'button';
      rm.setAttribute('aria-label', 'Remove ' + s.title);
      rm.textContent = '×';
      rm.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        shortcuts.splice(i, 1);
        save(); render();
      });

      a.addEventListener('click', (e) => { if (editing) e.preventDefault(); });
      wrap.append(circle, rm);
      a.append(wrap, label);
      grid.appendChild(a);
    });

    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'item add';
    add.setAttribute('aria-label', 'Add shortcut');
    add.innerHTML = '<div class="circle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>';
    add.addEventListener('click', openDialog);
    grid.appendChild(add);
  }
  render();

  /* ---------- Dialog ---------- */
  const overlay = $('overlay');
  function openDialog() {
    $('dialog').reset();
    overlay.classList.add('open');
    setTimeout(() => $('s-title').focus(), 0);
  }
  function closeDialog() { overlay.classList.remove('open'); }
  $('cancel').addEventListener('click', closeDialog);
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeDialog(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeDialog(); closeMenu(); setEditing(false); }
  });
  $('dialog').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = $('s-title').value.trim();
    const url = normalizeUrl($('s-url').value);
    if (!url) { toast('Please enter a valid URL'); $('s-url').focus(); return; }
    shortcuts.push({ title: title || hostOf(url), url });
    save(); render(); closeDialog();
  });

  /* ---------- Import / Export ---------- */
  $('export-btn').addEventListener('click', () => {
    closeMenu();
    const data = { version: 1, shortcuts };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'startpage-shortcuts.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Exported ' + shortcuts.length + ' shortcuts');
  });

  $('import-btn').addEventListener('click', () => { closeMenu(); $('import-file').click(); });
  $('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const list = Array.isArray(parsed) ? parsed : parsed.shortcuts;
      if (!Array.isArray(list)) throw new Error('bad format');
      let added = 0;
      for (const item of list) {
        const url = normalizeUrl(String(item && item.url || ''));
        if (!url) continue;
        if (shortcuts.some((s) => s.url === url)) continue;
        shortcuts.push({ title: String(item.title || hostOf(url)).slice(0, 60), url });
        added++;
      }
      save(); render();
      toast(added ? 'Imported ' + added + ' shortcuts' : 'Nothing new to import');
    } catch {
      toast('Could not read that file');
    }
  });

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
})();
</script>
</body>
</html>
